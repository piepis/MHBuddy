# One command from the repo root: docker compose up --build
# Then open http://localhost:8080/
# Postgres stays on the compose network. It is not published to the host.
# MH_DEV_AUTH is local only. Do not expose this stack on a public address.

name: mhbuddy

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: mhbuddy
      POSTGRES_DB: mhbuddy
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mhbuddy -d mhbuddy"]
      interval: 2s
      timeout: 5s
      retries: 30

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://mhbuddy@db:5432/mhbuddy?sslmode=disable
      MH_DEV_AUTH: "1"
      MH_ADMINS: hunter-a
      PORT: "8080"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s

volumes:
  mhbuddy-pg:
